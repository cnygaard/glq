[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "glq"
version = "0.8.13"
description = "Lattice and trellis-coded quantization for LLM weights (2-8 bpw)"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# The HF-transformers inference path: `import glq.hf_integration` needs transformers,
# and the README's device_map="auto" needs accelerate. Verified on a clean Ubuntu 24.04
# box: `pip install glq` alone fails that snippet on both, in that order.
hf = ["transformers", "accelerate"]
cuda = ["triton"]
dev = ["pytest"]
quantize = ["transformers", "datasets", "safetensors", "accelerate", "sentencepiece"]
# card generation + HF upload for the batch quantizer (scripts/batch_quantization.py)
hub = ["jinja2", "huggingface_hub", "pyyaml"]
# examples/chat — Gradio UI talking to vLLM's OpenAI-compatible endpoint
# gradio>=6: ChatInterface dropped `type=` and made the messages history
# format the only one, which is what glq/chat.py builds against.
chat = ["gradio>=6", "openai"]
# model-performance benchmarking toolkit (glq-bench)
bench = ["vllm", "datasets", "huggingface_hub", "jinja2", "pyyaml", "matplotlib", "pandas"]

[project.scripts]
glq-quantize = "glq.quantize_model:main"
glq-quantize-kv = "glq.quantize_kv:main"
glq-bench = "glq.bench.cli:main"
glq-setup = "glq.installer.__main__:main"
glq-chat = "glq.chat:main"
glq-code = "glq.code:main"

[project.entry-points."vllm.general_plugins"]
glq = "glq_vllm:register"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that download models / take >30s (deselect with '-m \"not slow\"')",
]

[tool.setuptools.packages.find]
include = ["glq*", "glq_vllm*"]

[tool.setuptools.package-data]
glq = ["*.pt", "csrc/*.cu", "csrc/*.cpp", "csrc/*.h", "csrc/*.cuh", "templates/*.j2"]
