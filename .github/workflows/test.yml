name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy
          # hub: jinja2 + huggingface_hub + pyyaml, the model-card feature's deps.
          # chat: gradio + openai. Not for the supervisor tests — those stub both, so they
          # run anywhere — but for tests/test_chat_ui.py, which is skipped without gradio
          # and is the only thing that builds the real UI. It was written after a gradio 6
          # API change crashed glq-chat on a box, and until now it skipped in CI too, so the
          # regression it exists to catch was caught by nobody.
          pip install -e ".[hub,chat]"
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v
