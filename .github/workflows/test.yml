name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy
          # safetensors is declared only in the `quantize` extra, which CI does not install
          # (transformers + datasets + accelerate is far too heavy for a CPU job). But
          # tests/test_resume_import.py writes real checkpoint shards, so without it 13 tests
          # covering the resume-store rebuild fail on an import rather than being skipped.
          # It is a ~1 MB wheel with no heavy dependencies, so install it directly instead of
          # pulling the whole extra or guarding the tests into silence.
          pip install safetensors
          # hub: jinja2 + huggingface_hub + pyyaml, the model-card feature's deps.
          # chat: gradio + openai. Not for the supervisor tests — those stub both, so they
          # run anywhere — but for tests/test_chat_ui.py, which is skipped without gradio
          # and is the only thing that builds the real UI. It was written after a gradio 6
          # API change crashed glq-chat on a box, and until now it skipped in CI too, so the
          # regression it exists to catch was caught by nobody.
          # --no-build-isolation is what lets GLQ_BUILD_CPU_EXT=1 actually build: pip's
          # isolated build env has no torch (it is installed two lines up, in THIS env),
          # and the flag correctly turns that into a hard error rather than a silent
          # skip. Non-isolated builds need the build deps present explicitly.
          pip install setuptools wheel ninja
          GLQ_BUILD_CPU_EXT=1 pip install -e ".[hub,chat]" --no-build-isolation
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v
